<!DOCTYPE html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
<main class="container">
{{template "nav" .}}
<h1>Categories</h1>

<article>
  <div style="overflow-x:auto">
  <table>
  <thead><tr><th>Name</th><th>Kind</th><th></th></tr></thead>
  <tbody>
  {{range .Categories}}
  <tr>
    <td>
      <form id="cat-{{.ID}}" method="post" action="/categories/{{.ID}}"></form>
      <input form="cat-{{.ID}}" type="text" name="name" value="{{.Name}}" required>
    </td>
    <td>
      <select form="cat-{{.ID}}" name="kind">
        <option value="expense" {{if eq .Kind "expense"}}selected{{end}}>Expense</option>
        <option value="income" {{if eq .Kind "income"}}selected{{end}}>Income</option>
        <option value="transfer" {{if eq .Kind "transfer"}}selected{{end}}>Transfer</option>
      </select>
    </td>
    <td style="white-space:nowrap">
      <button form="cat-{{.ID}}" type="submit">Save</button>
      <form method="post" action="/categories/{{.ID}}/delete" style="display:inline" onsubmit="return confirm('Delete category {{.Name}}? Transactions using it will become uncategorized.')">
        <button class="secondary outline" type="submit">Delete</button>
      </form>
    </td>
  </tr>
  {{end}}
  </tbody>
  </table>
  </div>
  <form method="post" action="/categories">
    <div class="grid">
      <label>Name <input type="text" name="name" required></label>
      <label>Kind
        <select name="kind">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
          <option value="transfer">Transfer</option>
        </select>
      </label>
    </div>
    <button type="submit">Add category</button>
  </form>
</article>
</main>
</body>
</html>
