<!DOCTYPE html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
<main class="container">
{{template "nav" .}}
<h1>Net worth</h1>
<h3>{{yen .Total}}</h3>
<canvas id="nwChart"></canvas>
<div style="overflow-x:auto">
<table>
<thead><tr><th>Account</th><th>Type</th><th style="text-align:right">Balance</th></tr></thead>
<tbody>
{{range .Rows}}<tr><td>{{.Name}}</td><td>{{.AccountType}}</td><td style="text-align:right">{{yen .BalanceMinor}}</td></tr>{{end}}
</tbody>
</table>
</div>
<script src="/static/js/chart.min.js"></script>
<script>
new Chart(document.getElementById('nwChart'), {
  type: 'line',
  data: { labels: {{.LabelsJSON}}, datasets: [{ label: 'Net worth', data: {{.DataJSON}} }] }
});
</script>
</main>
</body>
</html>
