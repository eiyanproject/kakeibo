<!DOCTYPE html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
<main class="container">
{{template "nav" .}}
<h1>Accounts</h1>
<div style="overflow-x:auto">
<table>
<thead><tr><th>Name</th><th>Type</th><th>Institution</th><th style="text-align:right">Balance</th><th></th></tr></thead>
<tbody>
{{range .Accounts}}
<tr>
  <td><a href="/accounts/{{.ID}}">{{.Name}}</a></td>
  <td>{{.AccountType}}</td>
  <td>{{.Institution}}</td>
  <td style="text-align:right">{{yen .BalanceMinor}}</td>
  <td><form method="post" action="/accounts/{{.ID}}/archive"><button class="secondary outline" type="submit">Archive</button></form></td>
</tr>
{{end}}
</tbody>
</table>
</div>

<h4>Add account</h4>
<form method="post" action="/accounts">
  <div class="grid">
    <label>Name <input type="text" name="name" required></label>
    <label>Institution <input type="text" name="institution"></label>
  </div>
  <div class="grid">
    <label>Type
      <select name="account_type">
        <option value="checking">Checking</option>
        <option value="credit">Credit</option>
        <option value="cash">Cash</option>
        <option value="investment">Investment</option>
        <option value="other">Other</option>
      </select>
    </label>
    <label>Currency <input type="text" name="currency" value="JPY"></label>
    <label>Opening balance <input type="number" step="0.01" name="opening_balance" value="0"></label>
  </div>
  <button type="submit">Add account</button>
</form>
</main>
</body>
</html>
